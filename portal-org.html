xcluirModal').classList.remove('hidden');['ID_UNICO','NOME','EMAIL','LMS','LDAP','EMPRESA','LIDER','LIDER_EMAIL','CARGO','CIDADE','UNIDADE','TURNO','MODAL','FOTO_URL'].forEach(k=>{let el=document.getElementById('f_'+k.toLowerCase());if(el)el.value=o[k]==='S/ EMPRESA'||o[k]==='S/ LÍDER'?'':(o[k]||'')});let fI=document.getElementById('f_foto_img'),fP=document.getElementById('f_foto_placeholder');if(o.FOTO_URL){fI.src=o.FOTO_URL;fI.classList.remove('hidden');fP.classList.add('hidden')}else{fI.classList.add('hidden');fP.classList.remove('hidden')}populateCadastroDatalists();document.getElementById('formModal').classList.remove('hidden');document.getElementById('formModal').classList.add('flex')}function salvarDados(){const f={ID_UNICO:document.getElementById('f_id').value,NOME:document.getElementById('f_nome').value.trim(),EMAIL:document.getElementById('f_email').value.trim(),LMS:document.getElementById('f_lms').value.trim(),LDAP:document.getElementById('f_ldap').value.trim(),EMPRESA:document.getElementById('f_empresa').value.trim().toUpperCase(),LIDER:document.getElementById('f_lider').value.trim(),LIDER_EMAIL:document.getElementById('f_lider_email').value.trim(),CARGO:document.getElementById('f_cargo').value.trim(),CIDADE:document.getElementById('f_cidade').value.trim(),UNIDADE:document.getElementById('f_unidade').value.trim().toUpperCase(),TURNO:document.getElementById('f_turno').value.trim(),MODAL:document.getElementById('f_modal').value.trim().toLowerCase(),FOTO_URL:document.getElementById('f_foto_url').value.trim()};if(!f.NOME||!f.LMS)return mostrarToast("Nome e LMS!",!1);const b=document.getElementById('btnSalvar'),o=b.innerHTML;b.innerHTML=`Salvando...`;b.disabled=!0;if(isAppsScript){google.script.run.withSuccessHandler(r=>{mostrarToast(r.message,!0);fecharModal();loadData();b.innerHTML=o;b.disabled=!1}).withFailureHandler(e=>{mostrarToast("Erro: "+e.message,!1);b.innerHTML=o;b.disabled=!1}).salvarFuncionario(f)}else{setTimeout(()=>{if(f.ID_UNICO){const i=baseData.findIndex(d=>d.ID_UNICO===f.ID_UNICO);if(i>-1)baseData[i]={...baseData[i],...f}}mostrarToast("Simulação Salva!",!0);fecharModal();b.innerHTML=o;b.disabled=!1;applyFilters()},800)}}function excluirDoModal(){const id=document.getElementById('f_id').value;if(!id)return;if(!confirm("Excluir permanentemente?"))return;const b=document.getElementById('btnExcluirModal'),o=b.innerHTML;b.innerHTML=`Excluindo...`;b.disabled=!0;if(isAppsScript){google.script.run.withSuccessHandler(r=>{mostrarToast(r.message,!0);fecharModal();loadData()}).withFailureHandler(e=>{mostrarToast("Erro: "+e.message,!1);b.innerHTML=o;b.disabled=!1}).excluirFuncionario(id)}else{setTimeout(()=>{baseData=baseData.filter(d=>d.ID_UNICO!==id);mostrarToast("Simulação Excluída!",!0);fecharModal();applyFilters()},600)}}window.onload=()=>{loadData();setTransform()};</script></body
